name: performance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Lint and formatting are their OWN job, not steps inside the test job.
  #
  # They need no browser, no network and no secrets, and they finish in
  # seconds. As a separate job they run concurrently with the suite, so a
  # style failure does not wait behind a ten-minute browser run and a test
  # failure is not hidden behind a style failure. Both verdicts arrive on
  # their own.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint

      # `--check`, never `--write`: CI reports, it does not silently rewrite
      # the branch it was asked to verify.
      - name: Prettier
        run: npm run format:check

  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Grafana's official action rather than the apt repository.
      #
      # The apt route is the one Grafana documents, and it does not work on a
      # GitHub runner: `gpg --keyserver` needs dirmngr, which is absent from
      # that image, so the key import fails with "can't connect to the dirmngr"
      # before apt is ever reached. The action resolves the latest release and
      # puts the binary on PATH with no key server involved — which is also why
      # it does not break on every k6 release the way a pinned release filename
      # would.
      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - run: k6 version

      # No npm install: there are no dependencies.
      - name: Smoke
        run: npm run test:smoke

      # Thresholds make k6 exit non-zero on a breach, so a regression fails the
      # job rather than printing numbers nobody reads.
      - name: Load
        run: npm run test:load

      # Stress is exploratory: a breach there is information, not a defect.
      # It runs on demand and never blocks a merge.
      - name: Stress
        if: github.event_name == 'workflow_dispatch'
        run: npm run test:stress
